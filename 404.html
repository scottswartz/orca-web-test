    <script>
        // Only the phone tools page (/m) installs as an app, so the full app never offers "Install"
        if (/\/m(\/|$)/.test(location.pathname)) {
            const add = (tag, attrs) => document.head.appendChild(Object.assign(document.createElement(tag), attrs));
            add("link", { rel: "manifest", href: "manifest.webmanifest" });
            add("link", { rel: "apple-touch-icon", href: "orca-tools-192.png" });
            add("meta", { name: "theme-color", content: "#3d85c6" });
            add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
            add("meta", { name: "apple-mobile-web-app-title", content: "Orca Tools" });
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("service-worker.js");

            // Chrome offers install only once, often before Blazor has started, so the offer is kept here
            // for the page's own Install button (MobileInstallButton) instead of Chrome's small pop-up
            window.orcaInstall = {
                offer: null,
                done: false,
                listener: null,
                state() {
                    if (this.done || matchMedia("(display-mode: standalone)").matches || navigator.standalone)
                        return "installed";
                    if (this.offer)
                        return "ready";
                    // Chrome holds the offer back until the page has been used for a bit; the menu works at once
                    if (/android/i.test(navigator.userAgent))
                        return "menu";
                    return /iphone|ipad|ipod/i.test(navigator.userAgent) ? "ios" : "unavailable";
                },
                async install() {
                    if (!this.offer)
                        return this.state();
                    this.offer.prompt();
                    const choice = await this.offer.userChoice;
                    this.offer = null;
                    this.done = choice.outcome === "accepted";
                    return this.state();
                },
                listen(dotNet) { this.listener = dotNet; },
                changed() { this.listener?.invokeMethodAsync("OnInstallChanged"); }
            };
            addEventListener("beforeinstallprompt", e => { e.preventDefault(); orcaInstall.offer = e; orcaInstall.changed(); });
            addEventListener("appinstalled", () => { orcaInstall.offer = null; orcaInstall.done = true; orcaInstall.changed(); });
        }
    </script>
