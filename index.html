    <script>
        // Only the phone tools page (/m) installs as an app, so the full app never offers "Install"
        if (/\/m(\/|$)/.test(location.pathname)) {
            const add = (tag, attrs) => document.head.appendChild(Object.assign(document.createElement(tag), attrs));
            add("link", { rel: "manifest", href: "manifest.webmanifest" });
            add("link", { rel: "apple-touch-icon", href: "orca-tools-192.png" });
            add("meta", { name: "theme-color", content: "#3d85c6" });
            add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
            add("meta", { name: "apple-mobile-web-app-title", content: "Orca Tools" });
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register("service-worker.js");
        }
    </script>
